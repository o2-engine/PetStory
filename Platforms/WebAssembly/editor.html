<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PetStory Editor</title>

    <style>
        /* Palette of the o2 editor itself: teal headers, pale green-grey panels */
        :root {
            --teal: #2F9E93;
            --teal-dark: #268578;
            --teal-darker: #1F6E64;
            --panel: #EDF2F1;
            --panel2: #E4EBEA;
            --panel3: #DCE4E3;
            --border: #B9C6C4;
            --text: #2E3836;
            --muted: #7A8A88;
            --sel: #CFE0F0;
            --sel-border: #9FC2E0;
            --white: #FAFCFC;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101014;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 12px;
        }
        #canvas-wrap { position: absolute; inset: 0 0 34px 0; }
        canvas#canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
            outline: none;
        }

        /* ---------- shared chrome ---------- */
        button.tbtn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--teal);
            color: #fff;
            border: 1px solid var(--teal-darker);
            border-radius: 3px;
            padding: 4px 9px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            line-height: 1;
        }
        button.tbtn:hover:not(:disabled) { background: var(--teal-dark); }
        button.tbtn:disabled { opacity: 0.45; cursor: default; }
        button.tbtn.quiet {
            background: var(--panel);
            color: var(--text);
            border-color: var(--border);
        }
        button.tbtn.quiet:hover:not(:disabled) { background: var(--panel3); }
        button.tbtn svg { width: 13px; height: 13px; flex: none; }
        svg.icon { width: 14px; height: 14px; flex: none; display: block; }

        /* ---------- bottom bar ---------- */
        #bottombar {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 34px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 0 8px;
            box-sizing: border-box;
            background: var(--panel);
            border-top: 1px solid var(--border);
            z-index: 30;
        }
        #bottombar .grow { flex: 1; }
        #assets-state { color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
        #assets-state.dirty { color: #B26B1D; }
        #changes-log {
            position: absolute;
            left: 8px;
            bottom: 40px;
            width: 420px;
            max-height: 45vh;
            overflow: auto;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 6px 24px rgba(20,40,38,.25);
            padding: 8px 10px;
            font-size: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            white-space: pre-wrap;
            display: none;
            z-index: 31;
        }

        /* ---------- boot overlay ---------- */
        #status {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.55);
            color: #eee;
            border-radius: 6px;
            pointer-events: none;
            z-index: 50;
        }
        #status.hidden { display: none; }
        #progress {
            display: block;
            margin-top: 8px;
            width: 220px;
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
        }
        #progress > span {
            display: block;
            height: 100%;
            width: 0%;
            background: var(--teal);
            transition: width 0.2s ease;
        }

        /* ---------- file browser ---------- */
        #browser-back {
            position: absolute;
            inset: 0;
            background: rgba(20, 35, 33, .35);
            display: none;
            z-index: 39;
        }
        #browser-back.open { display: block; }
        #browser {
            position: absolute;
            inset: 4% 4% 44px 4%;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 5px;
            display: none;
            flex-direction: column;
            z-index: 40;
            box-shadow: 0 14px 48px rgba(15,35,32,.45);
            overflow: hidden;
        }
        #browser.open { display: flex; }
        #browser-title {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--teal);
            color: #fff;
            padding: 5px 10px;
            font-weight: 600;
            user-select: none;
        }
        #browser-title .grow { flex: 1; }
        #browser-title .winbtn {
            background: none; border: none; color: #fff; cursor: pointer;
            padding: 2px; display: flex; border-radius: 3px;
        }
        #browser-title .winbtn:hover { background: rgba(255,255,255,.18); }
        #browser-toolbar {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 8px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        #browser-body { flex: 1; display: flex; min-height: 0; }

        /* tree */
        #tree {
            width: 250px;
            min-width: 180px;
            overflow: auto;
            background: var(--white);
            border-right: 1px solid var(--border);
            padding: 4px 0;
            user-select: none;
        }
        .t-node { }
        .t-row {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px 2px 0;
            white-space: nowrap;
            cursor: default;
        }
        .t-row:hover { background: var(--panel2); }
        .t-row.selected { background: var(--sel); outline: 1px solid var(--sel-border); outline-offset: -1px; }
        .t-row.drop-target { background: #D6EBD6; outline: 1px dashed var(--teal); outline-offset: -1px; }
        .t-row .chev {
            width: 14px; height: 14px; flex: none;
            display: flex; align-items: center; justify-content: center;
            color: var(--muted);
        }
        .t-row .chev.leaf { visibility: hidden; }
        .t-row .chev svg { transition: transform .1s ease; }
        .t-row.expanded .chev svg { transform: rotate(90deg); }
        .t-row .t-label { overflow: hidden; text-overflow: ellipsis; }
        .t-kids { display: none; }
        .t-node.expanded > .t-kids { display: block; }
        .t-row img.thumb { width: 14px; height: 14px; object-fit: contain; flex: none; }

        /* grid */
        #grid-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel2); }
        #crumbs {
            padding: 6px 10px;
            color: var(--teal-darker);
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            user-select: none;
            white-space: nowrap;
            overflow: hidden;
        }
        #crumbs span { cursor: pointer; }
        #crumbs span:hover { text-decoration: underline; }
        #grid {
            flex: 1;
            overflow: auto;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 84px);
            grid-auto-rows: 92px;
            gap: 6px;
            align-content: start;
        }
        .g-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 2px 2px;
            border-radius: 4px;
            cursor: default;
            text-align: center;
            overflow: hidden;
        }
        .g-item:hover { background: var(--panel3); }
        .g-item.selected { background: var(--sel); outline: 1px solid var(--sel-border); outline-offset: -1px; }
        .g-item.drop-target { background: #D6EBD6; outline: 1px dashed var(--teal); outline-offset: -1px; }
        .g-item .g-ico {
            width: 44px; height: 44px; flex: none;
            display: flex; align-items: center; justify-content: center;
        }
        .g-item .g-ico svg { width: 40px; height: 40px; }
        .g-item .g-ico img {
            max-width: 44px; max-height: 44px;
            image-rendering: auto;
            background: repeating-conic-gradient(#cfd8d6 0% 25%, #e8eeed 0% 50%) 0 0/12px 12px;
            border: 1px solid var(--border);
            border-radius: 2px;
        }
        .g-item .g-name {
            font-size: 11px;
            line-height: 1.2;
            max-height: 2.4em;
            overflow: hidden;
            word-break: break-word;
            width: 100%;
        }
        #grid.drag-over { outline: 2px dashed var(--teal); outline-offset: -4px; }

        /* preview / editor pane */
        #pane {
            width: 46%;
            min-width: 320px;
            display: none;
            flex-direction: column;
            border-left: 1px solid var(--border);
            background: var(--white);
        }
        #pane.open { display: flex; }
        #pane-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 8px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            min-height: 26px;
        }
        #pane-name {
            color: var(--teal-darker);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            display: inline-flex; align-items: center; gap: 6px;
        }
        #pane-view { flex: 1; min-height: 0; position: relative; overflow: auto; }
        #pane-view .placeholder { color: var(--muted); padding: 24px; }
        #pane-view .imgbox {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: repeating-conic-gradient(#cfd8d6 0% 25%, #e8eeed 0% 50%) 0 0/22px 22px;
        }
        #pane-view .imgbox img { max-width: 96%; max-height: 96%; image-rendering: pixelated; }
        #monaco-holder { position: absolute; inset: 0; }
        #pane-view textarea {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            box-sizing: border-box;
            background: #fff; color: #222;
            border: none; outline: none; resize: none;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px; padding: 10px;
        }

        /* ---------- changes dialog ---------- */
        #changes-back {
            position: absolute;
            inset: 0;
            background: rgba(20, 35, 33, .35);
            display: none;
            z-index: 41;
        }
        #changes-back.open { display: block; }
        #changes {
            position: absolute;
            inset: 6% 6% 44px 6%;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 5px;
            display: none;
            flex-direction: column;
            z-index: 42;
            box-shadow: 0 14px 48px rgba(15,35,32,.45);
            overflow: hidden;
        }
        #changes.open { display: flex; }
        #changes-title {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--teal);
            color: #fff;
            padding: 5px 10px;
            font-weight: 600;
            user-select: none;
        }
        #changes-title .grow { flex: 1; }
        #changes-body { flex: 1; display: flex; min-height: 0; }
        #changes-list {
            width: 320px;
            min-width: 220px;
            overflow: auto;
            background: var(--white);
            border-right: 1px solid var(--border);
            padding: 4px 0;
            user-select: none;
        }
        .ch-row {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 3px 8px;
            white-space: nowrap;
            cursor: default;
            font-size: 12px;
        }
        .ch-row:hover { background: var(--panel2); }
        .ch-row.selected { background: var(--sel); outline: 1px solid var(--sel-border); outline-offset: -1px; }
        .ch-row .badge {
            flex: none;
            width: 15px; height: 15px;
            border-radius: 3px;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }
        .ch-row .badge.A { background: #3B8E6B; }
        .ch-row .badge.M { background: #C88A2B; }
        .ch-row .badge.D { background: #B5514A; }
        .ch-row .ch-path { overflow: hidden; text-overflow: ellipsis; }
        .ch-empty { color: var(--muted); padding: 18px 12px; }
        #changes-view { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--white); }
        #cv-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            min-height: 26px;
        }
        #cv-name { color: var(--teal-darker); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #cv-view { flex: 1; min-height: 0; position: relative; overflow: hidden; }
        #cv-view .placeholder { color: var(--muted); padding: 24px; }
        #cv-diff { position: absolute; inset: 0; }
        .cv-imgs { position: absolute; inset: 0; display: flex; }
        .cv-side {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }
        .cv-side:last-child { border-right: none; }
        .cv-side .cv-cap {
            padding: 4px 8px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            color: var(--muted);
            font-size: 11px;
        }
        .cv-side .cv-imgbox {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            background: repeating-conic-gradient(#cfd8d6 0% 25%, #e8eeed 0% 50%) 0 0/22px 22px;
            overflow: auto;
        }
        .cv-side .cv-imgbox img { max-width: 96%; max-height: 96%; image-rendering: pixelated; }
        .cv-side .cv-missing {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            color: var(--muted);
            background: var(--panel2);
        }

        /* ---------- context menu ---------- */
        #ctx {
            position: fixed;
            min-width: 180px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 8px 28px rgba(15,35,32,.3);
            padding: 3px;
            display: none;
            z-index: 60;
            user-select: none;
        }
        #ctx .mi {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: default;
            white-space: nowrap;
        }
        #ctx .mi:hover { background: var(--teal); color: #fff; }
        #ctx .mi:hover svg { color: #fff; }
        #ctx .mi svg { color: var(--muted); }
        #ctx .sep { height: 1px; background: var(--border); margin: 3px 6px; }

        /* ---------- modal dialogs ---------- */
        #modal-back {
            position: fixed; inset: 0;
            background: rgba(20, 35, 33, .35);
            display: none;
            align-items: center; justify-content: center;
            z-index: 70;
        }
        #modal-back.open { display: flex; }
        #modal {
            width: 380px;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 5px;
            box-shadow: 0 16px 48px rgba(10,25,22,.5);
            overflow: hidden;
        }
        #modal-title {
            background: var(--teal);
            color: #fff;
            font-weight: 600;
            padding: 6px 10px;
        }
        #modal-body { padding: 14px 12px; }
        #modal-msg { margin-bottom: 10px; white-space: pre-wrap; }
        #modal-input {
            width: 100%;
            box-sizing: border-box;
            background: var(--white);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 6px 8px;
            font-size: 12px;
            outline: none;
        }
        #modal-input:focus { border-color: var(--teal); }
        #modal-buttons {
            display: flex; justify-content: flex-end; gap: 6px;
            padding: 0 12px 12px;
        }
    </style>
</head>
<body>
    <div id="canvas-wrap">
        <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <div id="bottombar">
        <span id="assets-state">connecting…</span>
        <button class="tbtn quiet" id="btn-changes" title="Show changed files">Changes</button>
        <button class="tbtn" id="btn-browser"><svg class="icon" viewBox="0 0 16 16"><use href="#i-folder"/></svg>Assets</button>
        <span class="grow"></span>
        <button class="tbtn quiet" id="btn-download" title="Download the session's Assets as a zip"><svg class="icon" viewBox="0 0 16 16"><use href="#i-down"/></svg>Save .zip</button>
        <button class="tbtn quiet" id="btn-upload" title="Replace the session's Assets from a zip"><svg class="icon" viewBox="0 0 16 16"><use href="#i-up"/></svg>Load .zip</button>
        <input id="upload-input" type="file" accept=".zip" style="display:none">
        <button class="tbtn quiet" id="btn-reload" title="Restart the editor with the current session"><svg class="icon" viewBox="0 0 16 16"><use href="#i-refresh"/></svg>Reload</button>
    </div>
    <div id="changes-log"></div>

    <div id="browser-back"></div>
    <div id="browser">
        <div id="browser-title">
            <svg class="icon" viewBox="0 0 16 16"><use href="#i-folder"/></svg>
            <span>Assets</span>
            <span class="grow"></span>
            <button class="winbtn" id="b-close" title="Close"><svg class="icon" viewBox="0 0 16 16"><use href="#i-close"/></svg></button>
        </div>
        <div id="browser-toolbar">
            <button class="tbtn" id="b-newfile"><svg class="icon" viewBox="0 0 16 16"><use href="#i-newfile"/></svg>New file</button>
            <button class="tbtn" id="b-newfolder"><svg class="icon" viewBox="0 0 16 16"><use href="#i-newfolder"/></svg>New folder</button>
            <button class="tbtn" id="b-uploadfile"><svg class="icon" viewBox="0 0 16 16"><use href="#i-up"/></svg>Upload</button>
            <input id="b-upload-input" type="file" multiple style="display:none">
            <span style="flex:1"></span>
            <button class="tbtn quiet" id="b-refresh"><svg class="icon" viewBox="0 0 16 16"><use href="#i-refresh"/></svg>Refresh</button>
        </div>
        <div id="browser-body">
            <div id="tree"></div>
            <div id="grid-wrap">
                <div id="crumbs"></div>
                <div id="grid"></div>
            </div>
            <div id="pane">
                <div id="pane-toolbar">
                    <span id="pane-name"></span>
                    <span style="flex:1"></span>
                    <button class="tbtn" id="v-save" style="display:none"><svg class="icon" viewBox="0 0 16 16"><use href="#i-save"/></svg>Save</button>
                    <button class="tbtn quiet" id="v-close"><svg class="icon" viewBox="0 0 16 16"><use href="#i-close"/></svg></button>
                </div>
                <div id="pane-view"><div class="placeholder">Select a file to preview</div></div>
            </div>
        </div>
    </div>

    <div id="changes-back"></div>
    <div id="changes">
        <div id="changes-title">
            <svg class="icon" viewBox="0 0 16 16"><use href="#i-rename"/></svg>
            <span>Changes</span>
            <span class="grow"></span>
            <button class="winbtn" id="ch-close" title="Close" style="background:none;border:none;color:#fff;cursor:pointer;padding:2px;display:flex;border-radius:3px"><svg class="icon" viewBox="0 0 16 16"><use href="#i-close"/></svg></button>
        </div>
        <div id="changes-body">
            <div id="changes-list"></div>
            <div id="changes-view">
                <div id="cv-toolbar"><span id="cv-name">Select a change to compare</span></div>
                <div id="cv-view"><div class="placeholder">Before / after preview appears here</div></div>
            </div>
        </div>
    </div>

    <div id="ctx"></div>

    <div id="modal-back">
        <div id="modal">
            <div id="modal-title"></div>
            <div id="modal-body">
                <div id="modal-msg"></div>
                <input id="modal-input" type="text" spellcheck="false">
            </div>
            <div id="modal-buttons"></div>
        </div>
    </div>

    <div id="status">
        <div id="status-text">Loading…</div>
        <div id="progress"><span></span></div>
    </div>

    <!-- SVG icon sprite: file-type icons drawn in the editor's flat teal style -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="i-close" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
            <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 2v8m0 0l-3-3m3 3l3-3M3 13h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="i-up" viewBox="0 0 16 16"><path d="M8 10V2m0 0L5 5m3-3l3 3M3 13h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
            <symbol id="i-save" viewBox="0 0 16 16"><path d="M3 3h8l2 2v8H3zM5 3v3h5V3M5 13V9h6v4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
            <symbol id="i-newfile" viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M11 11h-4M9 9v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" transform="translate(-1.5 -1)"/></symbol>
            <symbol id="i-newfolder" viewBox="0 0 16 16"><path d="M2 4h4l1.5 1.5H14V13H2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 11.5h4M10 9.5v4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" transform="translate(-2 -1.2)"/></symbol>

            <symbol id="i-f-text" viewBox="0 0 16 16"><path d="M3.5 1.5h6l3 3v10h-9z" fill="#F8F8F8" stroke="#8FA5A2" stroke-width="1"/><path d="M5.3 7h5.4M5.3 9h5.4M5.3 11h3.4" stroke="#7A8A88" stroke-width="1" stroke-linecap="round"/></symbol>

    </svg>

    <script type="text/javascript">
        console.log('[shell] editor shell; build-tag=editor-3-styled');

        // ---- session bootstrap (per browser tab) --------------------------
        var sid = sessionStorage.getItem('o2sid');
        if (!sid) {
            sid = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
            sessionStorage.setItem('o2sid', sid);
        }
        document.cookie = 'o2sid=' + sid + '; Path=/; SameSite=Strict';
        window.o2fsEndpoint = '/api';

        var statusEl = document.getElementById('status');
        var statusText = document.getElementById('status-text');
        var progressBar = document.querySelector('#progress > span');
        function setStatus(text, frac) {
            if (!text) { statusEl.classList.add('hidden'); return; }
            statusEl.classList.remove('hidden');
            statusText.textContent = text;
            if (typeof frac === 'number')
                progressBar.style.width = (frac * 100).toFixed(1) + '%';
        }

        // ---- modal dialogs (replace prompt/confirm/alert) ----------------
        var modal = (function () {
            var back = document.getElementById('modal-back');
            var title = document.getElementById('modal-title');
            var msg = document.getElementById('modal-msg');
            var input = document.getElementById('modal-input');
            var buttons = document.getElementById('modal-buttons');
            var active = null;

            function close(result) {
                back.classList.remove('open');
                var a = active; active = null;
                if (a) a(result);
            }
            back.addEventListener('mousedown', function (e) { if (e.target === back) close(null); });
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') close(input.value.trim() || null);
                if (e.key === 'Escape') close(null);
            });

            function show(opts) {
                return new Promise(function (resolve) {
                    active = resolve;
                    title.textContent = opts.title || 'PetStory Editor';
                    msg.textContent = opts.message || '';
                    msg.style.display = opts.message ? '' : 'none';
                    input.style.display = opts.input ? '' : 'none';
                    input.value = opts.value || '';
                    buttons.innerHTML = '';
                    (opts.buttons || []).forEach(function (b) {
                        var el = document.createElement('button');
                        el.className = 'tbtn' + (b.primary ? '' : ' quiet');
                        el.textContent = b.label;
                        el.onclick = function () { close(b.value === 'INPUT' ? (input.value.trim() || null) : b.value); };
                        buttons.appendChild(el);
                    });
                    back.classList.add('open');
                    if (opts.input) setTimeout(function () { input.focus(); input.select(); }, 30);
                });
            }
            return {
                prompt: function (t, m, v) {
                    return show({ title: t, message: m, input: true, value: v,
                        buttons: [{ label: 'Cancel', value: null }, { label: 'OK', value: 'INPUT', primary: true }] });
                },
                confirm: function (t, m, okLabel) {
                    return show({ title: t, message: m,
                        buttons: [{ label: 'Cancel', value: null }, { label: okLabel || 'OK', value: true, primary: true }] });
                },
                alert: function (t, m) {
                    return show({ title: t, message: m, buttons: [{ label: 'OK', value: true, primary: true }] });
                },
            };
        })();

        // ---- snapshot streaming ------------------------------------------
        function loadSnapshot(done, fail) {
            fetch('/api/fs/snapshot').then(function (resp) {
                if (!resp.ok) throw new Error('snapshot HTTP ' + resp.status);
                var total = +resp.headers.get('X-Uncompressed-Length') || 0;
                var reader = resp.body.getReader();
                var chunks = [], loaded = 0;
                function pump() {
                    return reader.read().then(function (r) {
                        if (r.done) return;
                        chunks.push(r.value);
                        loaded += r.value.length;
                        setStatus('Downloading project… ' + (loaded / 1048576).toFixed(1) + ' MB', total ? loaded / total : 0);
                        return pump();
                    });
                }
                return pump().then(function () {
                    var buf = new Uint8Array(loaded), off = 0;
                    for (var i = 0; i < chunks.length; i++) { buf.set(chunks[i], off); off += chunks[i].length; }
                    return buf;
                });
            }).then(function (buf) {
                var magic = String.fromCharCode.apply(null, buf.subarray(0, 8));
                if (magic !== 'O2SNAP01') throw new Error('bad snapshot magic');
                var indexLen = new DataView(buf.buffer, buf.byteOffset + 8, 4).getUint32(0, true);
                var index = JSON.parse(new TextDecoder().decode(buf.subarray(12, 12 + indexLen)));
                var off = 12 + indexLen;

                setStatus('Unpacking project…', 1);
                var FS = Module.FS;
                var madeDirs = {};
                function mkdirs(dir) {
                    if (madeDirs[dir]) return;
                    FS.mkdirTree(dir);
                    madeDirs[dir] = true;
                }
                for (var i = 0; i < index.files.length; i++) {
                    var f = index.files[i];
                    var full = '/project/' + f.p;
                    mkdirs(full.substring(0, full.lastIndexOf('/')));
                    FS.writeFile(full, buf.subarray(off, off + f.s));
                    if (f.m) try { FS.utime(full, f.m, f.m); } catch (e) {}
                    off += f.s;
                }
                mkdirs('/project/Bin/WebAssembly');
                console.log('[shell] snapshot unpacked:', index.files.length, 'files');
                done();
            }).catch(function (e) {
                console.error('[shell] snapshot failed', e);
                setStatus('Failed to load project: ' + e.message);
                fail(e);
            });
        }

        var Module = {
            canvas: (function () {
                var c = document.getElementById('canvas');
                c.addEventListener('webglcontextlost', function (e) {
                    console.error('[shell] webglcontextlost');
                    setStatus('WebGL context lost — reload the page');
                    e.preventDefault();
                }, false);
                return c;
            })(),
            print: function (text) { console.log('[wasm.out]', text); },
            printErr: function (text) { console.error('[wasm.err]', text); },
            setStatus: function (text) {
                if (text) console.log('[shell.setStatus]', text);
                var m = text && text.match(/([^\(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                if (m) setStatus(m[1].trim(), parseFloat(m[2]) / parseFloat(m[4]));
                else if (text) setStatus(text);
                else setStatus(null);
            },
            preRun: [function () {
                Module.addRunDependency('project-snapshot');
                loadSnapshot(
                    function () { Module.removeRunDependency('project-snapshot'); },
                    function () { /* startup halts with the error shown */ });
            }],
            onRuntimeInitialized: function () { console.log('[shell.onRuntimeInitialized]'); },
            onAbort: function (reason) { console.error('[shell.onAbort]', reason); setStatus('Crashed: ' + reason); },
            onExit: function (code) { console.log('[shell.onExit]', code); }
        };
        setStatus('Downloading editor…');
        window.onerror = function (e) { console.error('[shell]', e); };

        // ---- shared Monaco loader + file-kind helpers --------------------
        var IMG_RE = /\.(png|jpe?g|gif|webp|svg)$/i;
        var TEXT_RE = /\.(txt|json|js|ts|xml|md|csv|ini|cfg|atlas|scn|proto|meta|mtl|mat|anim|fntstyle|frag|vert|glsl|metal|shader|yaml|yml|lua|cpp|h|hpp|c)$/i;
        function fileKind(name) {
            if (IMG_RE.test(name)) return 'image';
            if (TEXT_RE.test(name)) return 'text';
            return 'binary';
        }
        var monacoLoaded = null;
        function loadMonaco() {
            if (monacoLoaded) return monacoLoaded;
            monacoLoaded = new Promise(function (resolve, reject) {
                var base = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min';
                var sc = document.createElement('script');
                sc.src = base + '/vs/loader.js';
                sc.onload = function () {
                    window.require.config({ paths: { vs: base + '/vs' } });
                    window.require(['vs/editor/editor.main'], function () { resolve(window.monaco); });
                };
                sc.onerror = function () { reject(new Error('monaco load failed')); };
                document.head.appendChild(sc);
            });
            return monacoLoaded;
        }

        // ---- bottom bar ---------------------------------------------------
        (function () {
            var stateEl = document.getElementById('assets-state');
            var logEl = document.getElementById('changes-log');
            var lastChanges = [];

            function refresh() {
                fetch('/api/assets/status').then(function (r) { return r.json(); }).then(function (s) {
                    lastChanges = s.changes || [];
                    if (!lastChanges.length) {
                        stateEl.textContent = 'Assets: no changes';
                        stateEl.classList.remove('dirty');
                    } else {
                        stateEl.textContent = 'Assets: ' + lastChanges.length + ' changed';
                        stateEl.classList.add('dirty');
                    }
                }).catch(function () {
                    stateEl.textContent = 'server unreachable';
                    stateEl.classList.add('dirty');
                });
            }

            document.getElementById('btn-changes').onclick = function () { openChangesDialog(); };

            document.getElementById('btn-download').onclick = function () {
                location.href = '/api/assets/zip';
            };

            var uploadInput = document.getElementById('upload-input');
            document.getElementById('btn-upload').onclick = function () { uploadInput.click(); };
            uploadInput.onchange = function () {
                var f = uploadInput.files[0];
                if (!f) return;
                modal.confirm('Load assets', 'Replace ALL Assets of this session with "' + f.name + '" and reload the editor?', 'Replace')
                    .then(function (ok) {
                        if (!ok) { uploadInput.value = ''; return; }
                        setStatus('Uploading assets…');
                        fetch('/api/assets/upload', { method: 'POST', body: f }).then(function (r) {
                            if (!r.ok) throw new Error('HTTP ' + r.status);
                            location.reload();
                        }).catch(function (e) {
                            setStatus(null);
                            modal.alert('Upload failed', e.message);
                        }).finally(function () { uploadInput.value = ''; });
                    });
            };

            document.getElementById('btn-reload').onclick = function () { location.reload(); };

            setInterval(refresh, 7000);
            refresh();
        })();

        // ---- file browser -------------------------------------------------
        (function () {
            var browser = document.getElementById('browser');
            var treeEl = document.getElementById('tree');
            var gridEl = document.getElementById('grid');
            var crumbsEl = document.getElementById('crumbs');
            var pane = document.getElementById('pane');
            var paneView = document.getElementById('pane-view');
            var paneName = document.getElementById('pane-name');
            var saveBtn = document.getElementById('v-save');
            var ctx = document.getElementById('ctx');

            var curDir = '';                 // directory shown in the grid
            var selected = null;             // {path, name, isDir, kind}
            var editorApi = null, openedPath = null;

            function iconFor(name, isDir, open) {
                if (isDir) return open ? '#i-folder-open' : '#i-folder';
                var ext = name.slice(name.lastIndexOf('.') + 1).toLowerCase();
                return {
                    scn: '#i-f-scene', proto: '#i-f-proto', mat: '#i-f-mat',
                    metal: '#i-f-shader', frag: '#i-f-shader', vert: '#i-f-shader', glsl: '#i-f-shader',
                    js: '#i-f-script', ts: '#i-f-script', lua: '#i-f-script',
                    json: '#i-f-json', atlas: '#i-f-atlas', anim: '#i-f-anim',
                    ttf: '#i-f-font', otf: '#i-f-font', fntstyle: '#i-f-font',
                    ogg: '#i-f-sound', wav: '#i-f-sound', mp3: '#i-f-sound',
                    meta: '#i-f-meta', txt: '#i-f-text', md: '#i-f-text', xml: '#i-f-text',
                }[ext] || '#i-f-generic';
            }
            function svgIcon(href, cls) {
                var ns = 'http://www.w3.org/2000/svg';
                var s = document.createElementNS(ns, 'svg');
                s.setAttribute('class', cls || 'icon');
                s.setAttribute('viewBox', '0 0 16 16');
                var u = document.createElementNS(ns, 'use');
                u.setAttribute('href', href);
                s.appendChild(u);
                return s;
            }
            function thumbOrIcon(path, name, isDir, cls) {
                if (!isDir && IMG_RE.test(name)) {
                    var img = document.createElement('img');
                    img.loading = 'lazy';
                    img.src = '/api/assets/file?path=' + encodeURIComponent(path);
                    img.onerror = function () { img.replaceWith(svgIcon('#i-f-generic', cls)); };
                    return img;
                }
                return svgIcon(iconFor(name, isDir), cls);
            }
            function joinPath(a, b) { return a ? a + '/' + b : b; }
            function parentOf(p) { var i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); }
            function baseOf(p) { var i = p.lastIndexOf('/'); return i < 0 ? p : p.slice(i + 1); }
            function api(list) { return fetch('/api/fs/list?dir=' + encodeURIComponent(list)).then(function (r) { return r.json(); }); }
            function assetsOp(body) {
                return fetch('/api/assets/op', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
                }).then(function (r) {
                    if (!r.ok) return r.json().then(function (j) { throw new Error(j.error || ('HTTP ' + r.status)); });
                });
            }

            // ---------------- tree (lazy) ----------------
            // node: {path, name, isDir, kind, el, kidsEl, loaded}
            var nodes = {}; // path -> node (dirs and files)

            function makeRow(node, depth) {
                var row = document.createElement('div');
                row.className = 't-row';
                row.style.paddingLeft = (depth * 14 + 4) + 'px';
                row.draggable = !!node.path;

                var chev = document.createElement('span');
                chev.className = 'chev' + (node.isDir ? '' : ' leaf');
                chev.appendChild(svgIcon('#i-chev'));
                row.appendChild(chev);

                row.appendChild(thumbOrIcon(node.path, node.name, node.isDir, 'icon'));
                if (!node.isDir && IMG_RE.test(node.name)) row.lastChild.className = 'thumb';

                var label = document.createElement('span');
                label.className = 't-label';
                label.textContent = node.name;
                row.appendChild(label);

                chev.onclick = function (e) { e.stopPropagation(); if (node.isDir) toggle(node); };
                row.onclick = function () {
                    selectNode(node);
                    if (node.isDir) openDir(node.path, false);
                    else { openDir(parentOf(node.path), false); previewFile(node.path, node.kind); }
                };
                row.ondblclick = function () { if (node.isDir) toggle(node, true); };
                row.oncontextmenu = function (e) {
                    e.preventDefault();
                    selectNode(node);
                    showCtx(e, node);
                };
                attachDragSource(row, node);
                if (node.isDir) attachDropTarget(row, function () { return node.path; });
                return row;
            }

            function makeNode(parentKidsEl, path, name, isDir, kind, depth) {
                var node = { path: path, name: name, isDir: isDir, kind: kind, loaded: false, depth: depth };
                var holder = document.createElement('div');
                holder.className = 't-node';
                node.holder = holder;
                node.el = makeRow(node, depth);
                holder.appendChild(node.el);
                if (isDir) {
                    node.kidsEl = document.createElement('div');
                    node.kidsEl.className = 't-kids';
                    holder.appendChild(node.kidsEl);
                }
                parentKidsEl.appendChild(holder);
                nodes[path] = node;
                return node;
            }

            function loadKids(node) {
                return api(node.path).then(function (d) {
                    node.kidsEl.innerHTML = '';
                    (d.dirs || []).forEach(function (f) {
                        makeNode(node.kidsEl, joinPath(node.path, f.name), f.name, true, null, node.depth + 1);
                    });
                    (d.files || []).forEach(function (f) {
                        makeNode(node.kidsEl, joinPath(node.path, f.name), f.name, false, f.kind, node.depth + 1);
                    });
                    node.loaded = true;
                });
            }

            function toggle(node, forceOpen) {
                var isOpen = node.holder.classList.contains('expanded');
                if (isOpen && !forceOpen) {
                    node.holder.classList.remove('expanded');
                    node.el.classList.remove('expanded');
                    return Promise.resolve();
                }
                node.holder.classList.add('expanded');
                node.el.classList.add('expanded');
                return node.loaded ? Promise.resolve() : loadKids(node);
            }

            function selectNode(node) {
                selected = node ? { path: node.path, name: node.name, isDir: node.isDir, kind: node.kind } : null;
                document.querySelectorAll('.t-row.selected, .g-item.selected').forEach(function (e) { e.classList.remove('selected'); });
                if (node && node.el) node.el.classList.add('selected');
            }

            var rootNode;
            function buildTree() {
                treeEl.innerHTML = '';
                nodes = {};
                rootNode = makeNode(treeEl, '', 'Assets', true, null, 0);
                nodes[''] = rootNode;
                return toggle(rootNode, true);
            }

            // expand the tree down to `dir` (after navigation via grid)
            function revealDir(dir) {
                var parts = dir ? dir.split('/') : [];
                var chain = Promise.resolve();
                var cur = '';
                parts.forEach(function (part) {
                    var p = cur ? cur + '/' + part : part;
                    chain = chain.then(function () {
                        var n = nodes[p];
                        return n && n.isDir ? toggle(n, true) : null;
                    });
                    cur = p;
                });
                return chain;
            }

            // refresh a directory's children in the tree (after fs changes)
            function refreshTreeDir(dir) {
                var n = nodes[dir];
                if (!n || !n.isDir) return Promise.resolve();
                // drop stale descendants from the index
                Object.keys(nodes).forEach(function (p) {
                    if (p !== dir && (dir === '' ? p !== '' : p.indexOf(dir + '/') === 0) && p !== dir)
                        delete nodes[p];
                });
                if (!n.holder.classList.contains('expanded')) { n.loaded = false; return Promise.resolve(); }
                return loadKids(n);
            }

            // ---------------- grid ----------------
            function renderCrumbs() {
                crumbsEl.innerHTML = '';
                var parts = curDir ? curDir.split('/') : [];
                var mk = function (label, target) {
                    var s = document.createElement('span');
                    s.textContent = label;
                    s.onclick = function () { openDir(target, true); };
                    crumbsEl.appendChild(s);
                };
                mk('Assets', '');
                parts.forEach(function (p, i) {
                    crumbsEl.appendChild(document.createTextNode('  ›  '));
                    mk(p, parts.slice(0, i + 1).join('/'));
                });
            }

            function openDir(dir, reveal) {
                curDir = dir;
                renderCrumbs();
                return api(dir).then(function (d) {
                    gridEl.innerHTML = '';
                    (d.dirs || []).forEach(function (f) { addGridItem(f.name, true, null); });
                    (d.files || []).forEach(function (f) { addGridItem(f.name, false, f.kind); });
                    if (reveal) revealDir(dir);
                });
            }

            function addGridItem(name, isDir, kind) {
                var path = joinPath(curDir, name);
                var item = document.createElement('div');
                item.className = 'g-item';
                item.draggable = true;

                var ico = document.createElement('div');
                ico.className = 'g-ico';
                ico.appendChild(thumbOrIcon(path, name, isDir, ''));
                if (ico.firstChild.tagName === 'svg') { ico.firstChild.style.width = '40px'; ico.firstChild.style.height = '40px'; }
                item.appendChild(ico);

                var label = document.createElement('div');
                label.className = 'g-name';
                label.textContent = name;
                label.title = name;
                item.appendChild(label);

                var node = { path: path, name: name, isDir: isDir, kind: kind, el: item };
                item.onclick = function () {
                    selected = { path: path, name: name, isDir: isDir, kind: kind };
                    document.querySelectorAll('.t-row.selected, .g-item.selected').forEach(function (e) { e.classList.remove('selected'); });
                    item.classList.add('selected');
                    if (!isDir) previewFile(path, kind);
                };
                item.ondblclick = function () { if (isDir) openDir(path, true); };
                item.oncontextmenu = function (e) {
                    e.preventDefault();
                    item.click();
                    showCtx(e, node);
                };
                attachDragSource(item, node);
                if (isDir) attachDropTarget(item, function () { return path; });
                gridEl.appendChild(item);
            }

            // ---------------- drag'n'drop ----------------
            function attachDragSource(el, node) {
                el.addEventListener('dragstart', function (e) {
                    if (!node.path) { e.preventDefault(); return; }
                    e.dataTransfer.setData('application/x-o2-path', node.path);
                    e.dataTransfer.effectAllowed = 'move';
                });
            }
            function attachDropTarget(el, getDir) {
                el.addEventListener('dragover', function (e) {
                    if (e.dataTransfer.types.indexOf('application/x-o2-path') >= 0 || e.dataTransfer.types.indexOf('Files') >= 0) {
                        e.preventDefault();
                        el.classList.add('drop-target');
                        e.dataTransfer.dropEffect = e.dataTransfer.types.indexOf('Files') >= 0 ? 'copy' : 'move';
                    }
                });
                el.addEventListener('dragleave', function () { el.classList.remove('drop-target'); });
                el.addEventListener('drop', function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    el.classList.remove('drop-target');
                    var dir = getDir();
                    if (e.dataTransfer.files && e.dataTransfer.files.length) {
                        uploadFiles(Array.prototype.slice.call(e.dataTransfer.files), dir);
                        return;
                    }
                    var src = e.dataTransfer.getData('application/x-o2-path');
                    if (!src) return;
                    var dst = joinPath(dir, baseOf(src));
                    if (src === dst || dst.indexOf(src + '/') === 0) return; // no-op or into itself
                    assetsOp({ op: 'move', path: src, path2: dst })
                        .then(function () { return afterChange([parentOf(src), dir]); })
                        .catch(function (e2) { modal.alert('Move failed', e2.message); });
                });
            }
            // dropping OS files anywhere on the grid uploads into the current dir
            attachDropTarget(gridEl, function () { return curDir; });
            gridEl.addEventListener('dragover', function () { gridEl.classList.add('drag-over'); });
            gridEl.addEventListener('dragleave', function () { gridEl.classList.remove('drag-over'); });
            gridEl.addEventListener('drop', function () { gridEl.classList.remove('drag-over'); });

            function uploadFiles(files, dir) {
                (function next() {
                    var f = files.shift();
                    if (!f) { afterChange([dir]); return; }
                    fetch('/api/assets/file?path=' + encodeURIComponent(joinPath(dir, f.name)), { method: 'PUT', body: f })
                        .then(next);
                })();
            }

            // re-sync UI after a mutation: grid + affected tree dirs
            function afterChange(dirs) {
                var uniq = {};
                (dirs || []).forEach(function (d) { uniq[d] = 1; });
                var chain = Promise.resolve();
                Object.keys(uniq).forEach(function (d) {
                    chain = chain.then(function () { return refreshTreeDir(d); });
                });
                return chain.then(function () { return openDir(curDir, false); });
            }

            // ---------------- context menu ----------------
            function mi(icon, label, fn) {
                var el = document.createElement('div');
                el.className = 'mi';
                el.appendChild(svgIcon(icon));
                el.appendChild(document.createTextNode(label));
                el.onclick = function () { hideCtx(); fn(); };
                return el;
            }
            function sep() { var s = document.createElement('div'); s.className = 'sep'; return s; }
            function hideCtx() { ctx.style.display = 'none'; }
            document.addEventListener('mousedown', function (e) { if (!ctx.contains(e.target)) hideCtx(); });

            function showCtx(e, node) {
                ctx.innerHTML = '';
                var dirOfNode = node.isDir ? node.path : parentOf(node.path);

                if (!node.isDir) {
                    ctx.appendChild(mi('#i-open', 'Open', function () { previewFile(node.path, node.kind); }));
                    ctx.appendChild(mi('#i-down', 'Download', function () {
                        location.href = '/api/assets/file?path=' + encodeURIComponent(node.path) + '&download=1';
                    }));
                    ctx.appendChild(sep());
                }
                if (node.path) {
                    ctx.appendChild(mi('#i-rename', 'Rename', function () {
                        modal.prompt('Rename', 'New name:', node.name).then(function (name) {
                            if (!name || name === node.name) return;
                            assetsOp({ op: 'move', path: node.path, path2: joinPath(parentOf(node.path), name) })
                                .then(function () { return afterChange([parentOf(node.path)]); })
                                .catch(function (e2) { modal.alert('Rename failed', e2.message); });
                        });
                    }));
                    ctx.appendChild(mi('#i-copy', 'Duplicate', function () {
                        var copyName = node.name.replace(/(\.[^.]*)?$/, '_copy$1');
                        assetsOp({ op: 'copy', path: node.path, path2: joinPath(parentOf(node.path), copyName) })
                            .then(function () { return afterChange([parentOf(node.path)]); })
                            .catch(function (e2) { modal.alert('Copy failed', e2.message); });
                    }));
                    ctx.appendChild(mi('#i-move', 'Move to…', function () {
                        modal.prompt('Move', 'Target path inside Assets:', node.path).then(function (target) {
                            if (!target || target === node.path) return;
                            assetsOp({ op: 'move', path: node.path, path2: target })
                                .then(function () { return afterChange([parentOf(node.path), parentOf(target)]); })
                                .catch(function (e2) { modal.alert('Move failed', e2.message); });
                        });
                    }));
                    ctx.appendChild(sep());
                    ctx.appendChild(mi('#i-trash', 'Delete', function () {
                        modal.confirm('Delete', 'Delete "' + node.name + '"' + (node.isDir ? ' and everything inside' : '') + '?', 'Delete')
                            .then(function (ok) {
                                if (!ok) return;
                                if (openedPath === node.path) closePane();
                                assetsOp({ op: 'delete', path: node.path })
                                    .then(function () { return afterChange([parentOf(node.path)]); })
                                    .catch(function (e2) { modal.alert('Delete failed', e2.message); });
                            });
                    }));
                    ctx.appendChild(sep());
                }
                ctx.appendChild(mi('#i-newfile', 'New file here', function () { newFile(dirOfNode); }));
                ctx.appendChild(mi('#i-newfolder', 'New folder here', function () { newFolder(dirOfNode); }));

                ctx.style.display = 'block';
                var x = Math.min(e.clientX, innerWidth - ctx.offsetWidth - 8);
                var y = Math.min(e.clientY, innerHeight - ctx.offsetHeight - 8);
                ctx.style.left = x + 'px';
                ctx.style.top = y + 'px';
            }
            // context menu on empty grid space
            gridEl.addEventListener('contextmenu', function (e) {
                if (e.target !== gridEl) return;
                e.preventDefault();
                showCtx(e, { path: '', name: 'Assets', isDir: true, kind: null, el: null, pathIsRoot: true });
            });

            // ---------------- preview / edit ----------------
            function closePane() {
                pane.classList.remove('open');
                editorApi = null; openedPath = null;
                saveBtn.style.display = 'none';
                paneView.innerHTML = '<div class="placeholder">Select a file to preview</div>';
                paneName.textContent = '';
            }
            document.getElementById('v-close').onclick = closePane;

            function monacoLanguage(name) {
                var ext = name.slice(name.lastIndexOf('.') + 1).toLowerCase();
                return { js: 'javascript', ts: 'typescript', json: 'json', scn: 'json', proto: 'json',
                         meta: 'json', mat: 'json', anim: 'json', fntstyle: 'json', atlas: 'json',
                         xml: 'xml', md: 'markdown', html: 'html', css: 'css',
                         cpp: 'cpp', h: 'cpp', c: 'cpp', lua: 'lua', yml: 'yaml', yaml: 'yaml',
                         metal: 'cpp', frag: 'cpp', vert: 'cpp', glsl: 'cpp' }[ext] || 'plaintext';
            }

            function previewFile(path, kind) {
                pane.classList.add('open');
                editorApi = null;
                saveBtn.style.display = 'none';
                openedPath = path;
                paneName.innerHTML = '';
                paneName.appendChild(svgIcon(iconFor(baseOf(path), false)));
                paneName.appendChild(document.createTextNode(path));

                if (IMG_RE.test(path)) {
                    paneView.innerHTML = '<div class="imgbox"><img alt=""></div>';
                    paneView.querySelector('img').src = '/api/assets/file?path=' + encodeURIComponent(path) + '&t=' + Date.now();
                } else if (kind === 'text') {
                    paneView.innerHTML = '<div class="placeholder">Loading…</div>';
                    fetch('/api/assets/file?path=' + encodeURIComponent(path)).then(function (r) { return r.text(); })
                        .then(function (text) {
                            if (openedPath !== path) return;
                            paneView.innerHTML = '<div id="monaco-holder"></div>';
                            saveBtn.style.display = '';
                            loadMonaco().then(function (monaco) {
                                if (openedPath !== path) return;
                                var ed = monaco.editor.create(document.getElementById('monaco-holder'), {
                                    value: text,
                                    language: monacoLanguage(path),
                                    theme: 'vs',
                                    automaticLayout: true,
                                    minimap: { enabled: false },
                                    fontSize: 12,
                                });
                                editorApi = { getValue: function () { return ed.getValue(); } };
                            }).catch(function () {
                                if (openedPath !== path) return;
                                paneView.innerHTML = '<textarea spellcheck="false"></textarea>';
                                var ta = paneView.querySelector('textarea');
                                ta.value = text;
                                editorApi = { getValue: function () { return ta.value; } };
                            });
                        });
                } else {
                    paneView.innerHTML = '<div class="placeholder">Binary file — no preview</div>';
                }
            }

            saveBtn.onclick = function () {
                if (!editorApi || !openedPath) return;
                fetch('/api/assets/file?path=' + encodeURIComponent(openedPath), {
                    method: 'PUT',
                    body: editorApi.getValue(),
                }).then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    var label = saveBtn.lastChild;
                    saveBtn.style.background = '#3B8E6B';
                    setTimeout(function () { saveBtn.style.background = ''; }, 800);
                }).catch(function (e) { modal.alert('Save failed', e.message); });
            };

            // ---------------- toolbar ----------------
            function newFile(dir) {
                modal.prompt('New file', 'File name:', 'new.txt').then(function (name) {
                    if (!name) return;
                    fetch('/api/assets/file?path=' + encodeURIComponent(joinPath(dir, name)), { method: 'PUT', body: '' })
                        .then(function () { return afterChange([dir]); });
                });
            }
            function newFolder(dir) {
                modal.prompt('New folder', 'Folder name:', 'NewFolder').then(function (name) {
                    if (name) assetsOp({ op: 'mkdir', path: joinPath(dir, name) })
                        .then(function () { return afterChange([dir]); });
                });
            }
            document.getElementById('b-newfile').onclick = function () { newFile(curDir); };
            document.getElementById('b-newfolder').onclick = function () { newFolder(curDir); };
            var bUpload = document.getElementById('b-upload-input');
            document.getElementById('b-uploadfile').onclick = function () { bUpload.click(); };
            bUpload.onchange = function () {
                var files = Array.prototype.slice.call(bUpload.files);
                bUpload.value = '';
                uploadFiles(files, curDir);
            };
            document.getElementById('b-refresh').onclick = function () {
                buildTree().then(function () { return openDir(curDir, true); });
            };

            var backdrop = document.getElementById('browser-back');
            function closeBrowser() {
                hideCtx();
                browser.classList.remove('open');
                backdrop.classList.remove('open');
            }
            backdrop.onclick = closeBrowser;
            document.getElementById('btn-browser').onclick = function () {
                if (browser.classList.contains('open')) { closeBrowser(); return; }
                browser.classList.add('open');
                backdrop.classList.add('open');
                buildTree().then(function () { return openDir(curDir, true); });
            };
            document.getElementById('b-close').onclick = closeBrowser;
        })();

        // ---- changes dialog: before/after comparison ----------------------
        (function () {
            var dlg = document.getElementById('changes');
            var back = document.getElementById('changes-back');
            var listEl = document.getElementById('changes-list');
            var nameEl = document.getElementById('cv-name');
            var viewEl = document.getElementById('cv-view');
            var current = null;
            var diffEditor = null;

            function close() {
                dlg.classList.remove('open');
                back.classList.remove('open');
                resetView();
            }
            back.onclick = close;
            document.getElementById('ch-close').onclick = close;

            function resetView() {
                if (diffEditor) { diffEditor.dispose(); diffEditor = null; }
                viewEl.innerHTML = '<div class="placeholder">Before / after preview appears here</div>';
                nameEl.textContent = 'Select a change to compare';
                current = null;
            }

            window.openChangesDialog = function () {
                dlg.classList.add('open');
                back.classList.add('open');
                resetView();
                listEl.innerHTML = '<div class="ch-empty">Loading…</div>';
                fetch('/api/assets/status').then(function (r) { return r.json(); }).then(function (st) {
                    var changes = st.changes || [];
                    listEl.innerHTML = '';
                    if (!changes.length) {
                        listEl.innerHTML = '<div class="ch-empty">No changes against the pristine Assets</div>';
                        return;
                    }
                    changes.forEach(function (c) {
                        var row = document.createElement('div');
                        row.className = 'ch-row';
                        var badge = document.createElement('span');
                        badge.className = 'badge ' + c.status;
                        badge.textContent = c.status;
                        row.appendChild(badge);
                        var pathEl = document.createElement('span');
                        pathEl.className = 'ch-path';
                        pathEl.textContent = c.path;
                        pathEl.title = c.path;
                        row.appendChild(pathEl);
                        row.onclick = function () {
                            listEl.querySelectorAll('.ch-row.selected').forEach(function (e) { e.classList.remove('selected'); });
                            row.classList.add('selected');
                            showDiff(c);
                        };
                        listEl.appendChild(row);
                    });
                }).catch(function (e) {
                    listEl.innerHTML = '<div class="ch-empty">Failed to load: ' + e.message + '</div>';
                });
            };

            function fileUrl(path, pristine) {
                return '/api/assets/file?path=' + encodeURIComponent(path) +
                       (pristine ? '&base=pristine' : '') + '&t=' + Date.now();
            }

            function showDiff(c) {
                current = c;
                if (diffEditor) { diffEditor.dispose(); diffEditor = null; }
                nameEl.textContent = c.status + '  ' + c.path;
                var kind = fileKind(c.path);

                if (kind === 'image') {
                    viewEl.innerHTML = '';
                    var box = document.createElement('div');
                    box.className = 'cv-imgs';
                    ['Before (pristine)', 'After (session)'].forEach(function (cap, i) {
                        var side = document.createElement('div');
                        side.className = 'cv-side';
                        var caption = document.createElement('div');
                        caption.className = 'cv-cap';
                        caption.textContent = cap;
                        side.appendChild(caption);
                        var missing = (i === 0 && c.status === 'A') || (i === 1 && c.status === 'D');
                        if (missing) {
                            var m = document.createElement('div');
                            m.className = 'cv-missing';
                            m.textContent = i === 0 ? 'File did not exist' : 'File deleted';
                            side.appendChild(m);
                        } else {
                            var ib = document.createElement('div');
                            ib.className = 'cv-imgbox';
                            var img = document.createElement('img');
                            img.src = fileUrl(c.path, i === 0);
                            img.onerror = function () {
                                ib.outerHTML = '<div class="cv-missing">Failed to load</div>';
                            };
                            ib.appendChild(img);
                            side.appendChild(ib);
                        }
                        box.appendChild(side);
                    });
                    viewEl.appendChild(box);
                    return;
                }

                if (kind === 'text') {
                    viewEl.innerHTML = '<div class="placeholder">Loading…</div>';
                    var get = function (pristine, skip) {
                        if (skip) return Promise.resolve('');
                        return fetch(fileUrl(c.path, pristine)).then(function (r) {
                            return r.ok ? r.text() : '';
                        });
                    };
                    Promise.all([
                        get(true, c.status === 'A'),
                        get(false, c.status === 'D'),
                    ]).then(function (texts) {
                        if (current !== c) return;
                        viewEl.innerHTML = '<div id="cv-diff"></div>';
                        loadMonaco().then(function (monaco) {
                            if (current !== c) return;
                            diffEditor = monaco.editor.createDiffEditor(document.getElementById('cv-diff'), {
                                readOnly: true,
                                renderSideBySide: true,
                                automaticLayout: true,
                                theme: 'vs',
                                fontSize: 12,
                                minimap: { enabled: false },
                            });
                            diffEditor.setModel({
                                original: monaco.editor.createModel(texts[0], undefined),
                                modified: monaco.editor.createModel(texts[1], undefined),
                            });
                        }).catch(function () {
                            if (current !== c) return;
                            // CDN unavailable: plain side-by-side text
                            viewEl.innerHTML = '<div class="cv-imgs">' +
                                '<div class="cv-side"><div class="cv-cap">Before (pristine)</div><textarea readonly style="flex:1;border:none;resize:none;font:12px ui-monospace,Menlo,monospace;padding:8px"></textarea></div>' +
                                '<div class="cv-side"><div class="cv-cap">After (session)</div><textarea readonly style="flex:1;border:none;resize:none;font:12px ui-monospace,Menlo,monospace;padding:8px"></textarea></div></div>';
                            var tas = viewEl.querySelectorAll('textarea');
                            tas[0].value = texts[0];
                            tas[1].value = texts[1];
                        });
                    });
                    return;
                }

                viewEl.innerHTML = '<div class="placeholder">Binary file — no preview (' +
                    (c.status === 'A' ? 'added' : c.status === 'D' ? 'deleted' : 'modified') + ')</div>';
            }
        })();

    </script>
    {{{ SCRIPT }}}
