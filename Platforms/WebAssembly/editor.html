<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PetStory Editor</title>
    <!-- Yandex.Metrika counter (shared 109132797; webvisor/clickmap OFF: their capture handlers swallow canvas events over the menu bar) -->
    <script type="text/javascript">(function(m,e,t,r,i,k,a){m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};m[i].l=1*new Date();for(var j=0;j<document.scripts.length;j++){if(document.scripts[j].src===r){return;}}k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})(window,document,'script','https://mc.yandex.ru/metrika/tag.js?id=109132797','ym');ym(109132797,'init',{ssr:true,referrer:document.referrer,url:location.href,accurateTrackBounce:true,trackLinks:true});</script>

    <link rel="stylesheet" href="shell/style.css">
</head>
<body>
    <div id="canvas-wrap">
        <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <div id="bottombar">
        <span id="assets-state">connecting…</span>
        <button class="tbtn quiet" id="btn-changes" title="Show changed files">Changes</button>
        <button class="tbtn" id="btn-browser"><svg class="icon" viewBox="0 0 16 16"><use href="#i-folder"/></svg>Assets</button>
        <button class="tbtn" id="btn-ai"><span class="ai-spinner"></span><svg class="icon" viewBox="0 0 16 16"><use href="#i-ai"/></svg>AI</button>
        <span class="grow"></span>
        <button class="tbtn quiet" id="btn-download" title="Download the session's Assets as a zip"><svg class="icon" viewBox="0 0 16 16"><use href="#i-down"/></svg>Save .zip</button>
        <button class="tbtn quiet" id="btn-upload" title="Replace the session's Assets from a zip"><svg class="icon" viewBox="0 0 16 16"><use href="#i-up"/></svg>Load .zip</button>
        <input id="upload-input" type="file" accept=".zip" style="display:none">
        <button class="tbtn quiet" id="btn-reload" title="Restart the editor with the current session"><svg class="icon" viewBox="0 0 16 16"><use href="#i-refresh"/></svg>Reload</button>
    </div>
    <div id="changes-log"></div>

    <div id="browser-back"></div>
    <div id="browser">
        <div id="browser-title">
            <svg class="icon" viewBox="0 0 16 16"><use href="#i-folder"/></svg>
            <span>Assets</span>
            <span class="grow"></span>
            <button class="winbtn" id="b-close" title="Close"><svg class="icon" viewBox="0 0 16 16"><use href="#i-close"/></svg></button>
        </div>
        <div id="browser-toolbar">
            <button class="tbtn" id="b-newfile"><svg class="icon" viewBox="0 0 16 16"><use href="#i-newfile"/></svg>New file</button>
            <button class="tbtn" id="b-newfolder"><svg class="icon" viewBox="0 0 16 16"><use href="#i-newfolder"/></svg>New folder</button>
            <button class="tbtn" id="b-uploadfile"><svg class="icon" viewBox="0 0 16 16"><use href="#i-up"/></svg>Upload</button>
            <input id="b-upload-input" type="file" multiple style="display:none">
            <span style="flex:1"></span>
            <button class="tbtn quiet" id="b-refresh"><svg class="icon" viewBox="0 0 16 16"><use href="#i-refresh"/></svg>Refresh</button>
        </div>
        <div id="browser-body">
            <div id="tree"></div>
            <div id="pane">
                <div id="pane-toolbar">
                    <span id="pane-name"></span>
                    <span style="flex:1"></span>
                    <button class="tbtn" id="v-save" style="display:none"><svg class="icon" viewBox="0 0 16 16"><use href="#i-save"/></svg>Save</button>
                    <button class="tbtn quiet" id="v-close"><svg class="icon" viewBox="0 0 16 16"><use href="#i-close"/></svg></button>
                </div>
                <div id="pane-view"><div class="placeholder">Select a file to preview</div></div>
            </div>
        </div>
    </div>

    <div id="changes-back"></div>
    <div id="changes">
        <div id="changes-title">
            <svg class="icon" viewBox="0 0 16 16"><use href="#i-rename"/></svg>
            <span>Changes</span>
            <span class="grow"></span>
            <button class="winbtn" id="ch-close" title="Close" style="background:none;border:none;color:#fff;cursor:pointer;padding:2px;display:flex;border-radius:3px"><svg class="icon" viewBox="0 0 16 16"><use href="#i-close"/></svg></button>
        </div>
        <div id="changes-body">
            <div id="changes-list"></div>
            <div id="changes-view">
                <div id="cv-toolbar"><span id="cv-name">Select a change to compare</span></div>
                <div id="cv-view"><div class="placeholder">Before / after preview appears here</div></div>
            </div>
        </div>
    </div>

    <div id="ai-back"></div>
    <div id="ai">
        <div id="ai-title">
            <svg class="icon" viewBox="0 0 16 16"><use href="#i-ai"/></svg>
            <span>AI Agent</span>
            <span class="grow"></span>
            <button class="winbtn" id="ai-close" title="Close" style="background:none;border:none;color:#fff;cursor:pointer;padding:2px;display:flex;border-radius:3px"><svg class="icon" viewBox="0 0 16 16"><use href="#i-close"/></svg></button>
        </div>
        <div id="ai-settings">
            <label>API key</label>
            <input id="ai-key" type="password" placeholder="Gemini API key" spellcheck="false" autocomplete="off">
            <label>Model</label>
            <input id="ai-model" type="text" list="ai-models" spellcheck="false" autocomplete="off">
            <datalist id="ai-models"></datalist>
            <label id="ai-debug-toggle" title="Expand the model's reasoning and tool steps"><input type="checkbox" id="ai-debug"> steps</label>
            <label id="ai-raw-toggle" title="Also log every raw API request and response"><input type="checkbox" id="ai-raw"> raw</label>
            <label id="ai-review-toggle" title="After each run, ask the agent to review its own work"><input type="checkbox" id="ai-review" checked> review</label>
            <button class="tbtn quiet" id="ai-copy" title="Copy the full conversation log as JSON">Log</button>
            <button class="tbtn quiet" id="ai-clear" title="Clear the conversation">Clear</button>
        </div>
        <div id="ai-chat"></div>
        <div id="ai-status"></div>
        <div id="ai-inputrow">
            <textarea id="ai-input" placeholder="Ask the agent… (Enter — send, Shift+Enter — new line)"></textarea>
            <button class="tbtn" id="ai-send">Send</button>
            <button class="tbtn quiet" id="ai-stop" style="display:none">Stop</button>
        </div>
    </div>

    <div id="ctx"></div>

    <div id="modal-back">
        <div id="modal">
            <div id="modal-title"></div>
            <div id="modal-body">
                <div id="modal-msg"></div>
                <input id="modal-input" type="text" spellcheck="false">
            </div>
            <div id="modal-buttons"></div>
        </div>
    </div>

    <div id="status">
        <div id="status-text">Loading…</div>
        <div id="progress"><span></span></div>
    </div>

            <symbol id="i-ai" viewBox="0 0 16 16"><path d="M8 1.5l1.4 3.6 3.6 1.4-3.6 1.4L8 11.5 6.6 7.9 3 6.5l3.6-1.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M12.5 10.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z" fill="currentColor"/></symbol>

            <symbol id="i-move" viewBox="0 0 16 16"><path d="M2 8h10m0 0L9 5m3 3l-3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 3v10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>

    <!-- Shell modules: plain classic scripts sharing globals, loaded in
         dependency order. boot.js must define Module before the emscripten
         script below runs. -->
    <script src="shell/boot.js"></script>
    <script src="shell/ui.js"></script>
    <script src="shell/bottombar.js"></script>
    <script src="shell/browser.js"></script>
    <script src="shell/changes.js"></script>
    <script src="shell/guides.js"></script>
    <script src="shell/ai.js"></script>

</body>
</html>
